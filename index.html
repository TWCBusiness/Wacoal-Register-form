<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wacoal Member Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- เพิ่ม LIFF SDK ของ LINE -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        /**
         * ดึงข้อมูล Line ID จริง (User ID) จาก LIFF SDK
         */
        async function initializeLiff() {
            const lineIdInput = document.getElementById('line_id');
            
            try {
                // เริ่มต้นการใช้งาน LIFF ด้วย LIFF ID ของคุณ
                await liff.init({ liffId: "2008993053-43rAp8yN" });

                if (liff.isLoggedIn()) {
                    // ดึงโปรไฟล์เพื่อหา User ID จริง (UID)
                    const profile = await liff.getProfile();
                    if (lineIdInput) {
                        lineIdInput.value = profile.userId; // จะได้ค่าที่ขึ้นต้นด้วย U...
                    }
                } else {
                    // หากยังไม่ได้ Login ให้สั่ง Login (หรือข้ามไปหากต้องการให้กรอกแบบ Web ทั่วไป)
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Error:', err);
                // กรณีเกิดข้อผิดพลาด ให้ใส่ค่าสำรองเพื่อให้ทราบว่าเป็น Direct Web
                if (lineIdInput && !lineIdInput.value) {
                    lineIdInput.value = "Direct Web / Error";
                }
            }
        }

        window.onload = initializeLiff;
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #fef1f6; }
        .wacoal-pink { background-color: #ed287a; }
        .wacoal-text { color: #ed287a; }
        .loader { border-top-color: #ed287a; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .header-container { background-color: #ed287a; border-bottom: 4px solid #d11d66; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-pink-100 my-8">
        <div class="header-container p-8 text-center relative">
            <h1 class="text-white text-2xl font-bold tracking-widest uppercase mb-1">Register Member</h1>
            <div class="h-1 w-12 bg-white mx-auto rounded-full opacity-50 mb-3"></div>
            <p class="text-pink-100 font-light text-xs tracking-wide">สิทธิพิเศษสำหรับสมาชิกรอคุณอยู่</p>
        </div>

        <div class="px-8 py-10">
            <div id="loading" class="hidden flex flex-col items-center py-10">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-100 h-12 w-12 mb-4"></div>
                <p class="wacoal-text font-medium text-lg text-center">กำลังตรวจสอบข้อมูล<br><span class="text-xs font-normal text-gray-400">กรุณารออีเมลแจ้งผลการสมัครสักครู่</span></p>
            </div>

            <div id="response-msg" class="hidden text-center py-10">
                <div id="msg-card" class="p-8 rounded-[2rem] mb-6 border shadow-sm">
                    <div id="msg-icon" class="w-20 h-20 text-white rounded-full flex items-center justify-center mx-auto mb-5 shadow-lg"></div>
                    <h2 id="msg-title" class="text-2xl font-bold mb-2"></h2>
                    <p id="msg-body" class="text-sm opacity-80 leading-relaxed"></p>
                </div>
                <button onclick="window.location.reload()" class="text-sm font-semibold wacoal-text hover:opacity-80 transition-opacity">กลับไปหน้าเริ่มต้น</button>
            </div>

            <form id="wacoalForm" class="space-y-6">
                <!-- ฟิลด์ซ่อนสำหรับ Line ID (UID) -->
                <input type="hidden" name="line_id" id="line_id" value="">

                <div class="space-y-5">
                    <div>
                        <label class="block text-gray-500 text-[11px] font-bold mb-1.5 uppercase tracking-widest ml-1">ชื่อ - นามสกุล</label>
                        <input type="text" name="name" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-100 focus:border-[#ed287a] transition-all text-gray-800 shadow-sm" placeholder="กรอกชื่อและนามสกุล">
                    </div>

                    <div>
                        <label class="block text-gray-500 text-[11px] font-bold mb-1.5 uppercase tracking-widest ml-1">เบอร์โทรศัพท์</label>
                        <input type="tel" name="tel" required pattern="[0-9]*" inputmode="numeric" class="w-full px-5 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-100 focus:border-[#ed287a] transition-all text-gray-800 shadow-sm" placeholder="08XXXXXXXX">
                    </div>

                    <div>
                        <label class="block text-gray-500 text-[11px] font-bold mb-1.5 uppercase tracking-widest ml-1">อีเมล</label>
                        <input type="email" name="email" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-100 focus:border-[#ed287a] transition-all text-gray-800 shadow-sm" placeholder="example@mail.com">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-500 text-[11px] font-bold mb-1.5 uppercase tracking-widest ml-1">เพศ</label>
                            <select name="gender" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-100 focus:border-[#ed287a] transition-all text-gray-800 appearance-none shadow-sm cursor-pointer">
                                <option value="" disabled selected>ระบุเพศ</option>
                                <option value="ชาย">ชาย</option>
                                <option value="หญิง">หญิง</option>
                                <option value="LGBTQ+">LGBTQ+</option>
                                <option value="ไม่ระบุเพศ">ไม่ระบุเพศ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-500 text-[11px] font-bold mb-1.5 uppercase tracking-widest ml-1">วันเกิด</label>
                            <input type="date" name="birthday" required class="w-full px-5 py-4 rounded-2xl border border-gray-100 bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-100 focus:border-[#ed287a] transition-all text-gray-800 shadow-sm cursor-pointer">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-gray-500 text-[11px] font-bold mb-3 uppercase tracking-widest ml-1">ช่องทางที่สมัคร (Location)</label>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="flex items-center justify-center p-4 border border-gray-100 rounded-2xl cursor-pointer bg-gray-50 hover:bg-pink-50 transition-all group shadow-sm">
                                <input type="radio" name="source" value="สำนักงานใหญ่" required class="accent-pink-500 mr-2">
                                <span class="text-sm text-gray-500">สำนักงานใหญ่</span>
                            </label>
                            <label class="flex items-center justify-center p-4 border border-gray-100 rounded-2xl cursor-pointer bg-gray-50 hover:bg-pink-50 transition-all group shadow-sm">
                                <input type="radio" name="source" value="งานแฟร์" required class="accent-pink-500 mr-2">
                                <span class="text-sm text-gray-500">งานแฟร์</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mt-10 pt-8 border-t border-gray-50" id="consentSection">
                    <h3 class="text-gray-800 text-sm font-bold uppercase mb-4 tracking-wider">นโยบายความเป็นส่วนตัว</h3>
                    <div class="bg-gray-50 rounded-2xl p-4 text-[11px] text-gray-500 leading-relaxed mb-4 border border-gray-100 shadow-inner">
                        <p class="font-bold mb-1 text-gray-600 italic">การคุ้มครองข้อมูลส่วนบุคคล (PDPA)</p>
                        ข้อมูลจะถูกเก็บเพื่อวัตถุประสงค์ในการลงทะเบียนสมาชิกและมอบสิทธิพิเศษเท่านั้น
                    </div>
                    
                    <div class="flex items-center justify-between bg-gray-50 p-2 rounded-2xl border border-gray-50">
                        <span class="text-[11px] text-gray-600 font-medium ml-3 italic">ยอมรับเงื่อนไขข้างต้น</span>
                        <div class="flex bg-white p-1 rounded-xl shadow-sm">
                            <label class="flex items-center px-4 py-2 rounded-lg cursor-pointer">
                                <input type="radio" name="pdpaConsent" value="ยินยอม" required class="accent-pink-500 mr-2">
                                <span class="text-[11px] text-gray-400">ยินยอม</span>
                            </label>
                            <label class="flex items-center px-4 py-2 rounded-lg cursor-pointer">
                                <input type="radio" name="pdpaConsent" value="ไม่ยินยอม" required class="accent-gray-400 mr-2">
                                <span class="text-[11px] text-gray-400">ปฏิเสธ</span>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full wacoal-pink hover:bg-[#d11d66] text-white font-bold py-5 rounded-[1.5rem] shadow-xl transition-all mt-4 tracking-widest text-sm uppercase">Register Now</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('wacoalForm');
        // ระบุ Web App URL ของคุณที่นี่
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw3NRgbzVKED_1GvACCIehaWNR3WpkNi5hzJI3dSQwluFk9EZVXvoWyGMsTMSZrIftxsw/exec";

        form.onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            if (data.pdpaConsent !== "ยินยอม") {
                alert("กรุณายอมรับเงื่อนไข PDPA เพื่อดำเนินการต่อ");
                return;
            }

            form.classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(data)
            })
            .then(() => {
                showResponse(true, "รับข้อมูลเรียบร้อย", "ระบบกำลังตรวจสอบข้อมูลของท่าน และจะส่งผลการลงทะเบียนให้ทราบผ่านทางอีเมลค่ะ");
            })
            .catch((error) => {
                console.error('Error:', error);
                showResponse(false, "เกิดข้อผิดพลาด", "ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่อีกครั้ง");
            });
        };

        function showResponse(success, title, body) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('response-msg').classList.remove('hidden');
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-body').innerText = body;
            const icon = document.getElementById('msg-icon');
            icon.className = success ? "w-20 h-20 bg-[#ed287a] text-white rounded-full flex items-center justify-center mx-auto mb-5 shadow-lg" : "w-20 h-20 bg-red-500 text-white rounded-full flex items-center justify-center mx-auto mb-5 shadow-lg";
            icon.innerHTML = success ? '<svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : 'X';
        }
    </script>
</body>
</html>
